name: Verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Build the upstream proof and run both comparator targets
        type: boolean
        default: false

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python3 verification/test_verifier.py
      - run: python3 verification/scan.py
  core:
    if: github.event_name != 'workflow_dispatch' || !inputs.full
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - run: python3 verification/check.py --scope core --require-clean
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: core-verification
          path: .verification-results/
          include-hidden-files: true
          retention-days: 90
  full:
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Obtain pinned upstream sources
        shell: bash
        run: |
          git clone https://github.com/M32026/3d-sticky-kakeya upstream/3d-sticky-kakeya
          revision=$(python3 -c 'import json; print(json.load(open("verification/unconditional/bridge-lock.json"))["bytedance_commit"])')
          git -C upstream/3d-sticky-kakeya checkout "$revision"
      - run: python3 verification/check.py --scope full --require-clean --jobs 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: full-verification
          path: .verification-results/
          include-hidden-files: true
          retention-days: 90
